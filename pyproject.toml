[project]
name = "eve-diagnostics"
version = "1.0.0"
description = "Diagnostic test booking API with simulated payments and an idempotent, signed payment webhook."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "argon2-cffi>=25.1",
    "celery[redis]>=5.6,<5.7",
    "django>=5.2.17,<5.3",
    "django-environ>=0.12",
    "django-filter>=25.1",
    "djangorestframework>=3.16,<3.19",
    "djangorestframework-simplejwt>=5.5.1,<6",
    "drf-spectacular[sidecar]>=0.30,<0.31",
    "gunicorn>=23",
    "httpx>=0.28",
    "psycopg[binary]>=3.2",
    "redis>=5.2",
    "structlog>=25.1",
    "tzdata>=2025.2",
    "whitenoise>=6.9",
]

[dependency-groups]
dev = [
    "factory-boy>=3.3",
    "pytest>=8.4",
    "pytest-cov>=6.2",
    "pytest-django>=4.11",
    "respx>=0.22",
    "ruff>=0.12",
    "time-machine>=2.16",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings_test"
testpaths = ["apps"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers --strict-config"

[tool.coverage.run]
source = ["apps", "config"]
branch = true
omit = ["*/migrations/*", "*/tests/*", "config/asgi.py", "config/wsgi.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["**/migrations/**"]

[tool.ruff.lint]
select = [
    "E", "W", "F",  # pycodestyle, pyflakes
    "I",            # import order
    "B",            # bugbear
    "UP",           # pyupgrade
    "DJ",           # django
    "DTZ",          # naive datetimes
    "S",            # bandit (security)
    "SIM", "C4", "RUF", "PT",
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106"]  # asserts and fixture passwords are expected in tests
"conftest.py" = ["S105", "S106"]
